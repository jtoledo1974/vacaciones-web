name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel outdated jobs on new commits to the same PR.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Unit tests and types
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: TypeScript typecheck
        run: pnpm exec tsc --noEmit -p tsconfig.app.json

  browser:
    name: Playwright desktop and mobile
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

# Detailed errors remain in the Actions logs. Do not upload Playwright
# screenshots/traces by default: the repository's artifact quota is limited.
