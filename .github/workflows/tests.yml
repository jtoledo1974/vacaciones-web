name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel outdated jobs on new commits to the same PR.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Unit tests and types
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: TypeScript typecheck
        run: pnpm exec tsc --noEmit -p tsconfig.app.json

  browser:
    name: Playwright desktop and mobile
    # This runner is separate from GitHub-hosted checks, so both jobs run concurrently.
    # One Playwright process and one worker keep RAM and isolated D1 within tested limits.
    # Conditions reduce exposure; repository writers can still change workflows.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.user.login == 'jtoledo1974' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.repo.fork == false) ||
      (github.event_name == 'workflow_dispatch' && github.actor == 'jtoledo1974')
    runs-on: [self-hosted, Linux, X64, vacaciones-ci]
    timeout-minutes: 30
    env:
      CI: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_JSON_OUTPUT_FILE: /job-control/playwright.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          clean: true
      - name: Verify local runner and installed tools
        shell: bash
        run: |
          test "$RUNNER_NAME" = pve-playwright-01
          node --version
          test "$(pnpm --version)" = 11.25.0
          test -d /ms-playwright
      - name: Install locked dependencies using the local store
        run: pnpm install --frozen-lockfile --store-dir /pnpm/store
      - name: Playwright desktop and targeted mobile regressions, one worker
        run: pnpm exec playwright test --workers=1 --retries=0 --reporter=list,json

# No default upload of screenshots, videos or traces: artifacts stay local.
# There is no GitHub-hosted fallback for the browser job.
