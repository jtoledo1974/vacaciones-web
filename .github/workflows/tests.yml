name: Tests
on:
  push:
    branches: [main]
  pull_request:
    # labeled lets the e2e-full label start the full suite without a new push.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner pool or laptop runner for manual validation
        type: choice
        default: vacaciones-ci-v2
        options:
          - vacaciones-ci-v2
          - portatil-playwright-01
          - portatil-playwright-02

# Cancel outdated jobs on new commits to the same PR.
# Unrelated labels get their own group so they do not cancel a running suite.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'e2e-full' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Unit tests and types
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: TypeScript typecheck
        run: pnpm exec tsc --noEmit -p tsconfig.app.json

  build:
    name: Build and informative lint
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      # The build needs no secrets or Site variables.
      - run: pnpm build
      # Informative until the existing errors are fixed; see docs/PRUEBAS.md.
      - name: Lint (informative)
        continue-on-error: true
        run: pnpm lint

  browser:
    name: Playwright desktop and mobile
    # The v2 pool includes the server and isolated laptop runners.
    # Keep the old label on the server for workflows already queued before this change.
    # One Playwright process and one worker keep RAM and isolated D1 within tested limits.
    # Conditions reduce exposure; repository writers can still change workflows.
    # PR pushes run the @smoke subset; main, manual runs and PRs labelled e2e-full run everything.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.user.login == 'jtoledo1974' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.repo.fork == false &&
       (github.event.action != 'labeled' || github.event.label.name == 'e2e-full')) ||
      (github.event_name == 'workflow_dispatch' && github.actor == 'jtoledo1974')
    runs-on: [self-hosted, Linux, X64, "${{ inputs.runner || 'vacaciones-ci-v2' }}"]
    timeout-minutes: 30
    env:
      CI: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_JSON_OUTPUT_FILE: /job-control/playwright.json
      E2E_SCOPE: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e-full')) && 'full' || 'smoke' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          clean: true
      - name: Verify local runner and installed tools
        shell: bash
        run: |
          case "$RUNNER_NAME" in
            pve-playwright-01|portatil-playwright-01|portatil-playwright-02) ;;
            *) echo "Unexpected runner: $RUNNER_NAME" >&2; exit 1 ;;
          esac
          node --version
          test "$(pnpm --version)" = 11.25.0
          test -d /ms-playwright
      - name: Install locked dependencies using the local store
        run: pnpm install --frozen-lockfile --store-dir /pnpm/store
      - name: Playwright ${{ env.E2E_SCOPE }} suite, one worker
        shell: bash
        run: |
          grep=()
          if [ "$E2E_SCOPE" = smoke ]; then grep=(--grep @smoke); fi
          pnpm exec playwright test --workers=1 --retries=0 --reporter=list,json "${grep[@]}"

# No default upload of screenshots, videos or traces: artifacts stay local.
# There is no GitHub-hosted fallback for the browser job.
