name: Tests
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner for manual validation (both jobs); empty uses the shared pool
        type: choice
        default: ''
        options:
          - ''
          - pve-playwright-01
          - portatil-playwright-01
          - portatil-playwright-02

# Cancel outdated jobs on new commits to the same PR.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks rápidos
    # Conditions reduce exposure; repository writers can still change workflows.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.user.login == 'jtoledo1974' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.repo.fork == false) ||
      (github.event_name == 'workflow_dispatch' && github.actor == 'jtoledo1974')
    # Any available server or laptop runner can execute these checks.
    runs-on: [self-hosted, Linux, X64, "${{ inputs.runner || 'vacaciones-ci-v2' }}"]
    # The serial unit suite shares this budget with install, format, types, build
    # and lint. Allow runner variation; each unit file still has its own timeout.
    timeout-minutes: 20
    env:
      CI: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          clean: true
      - name: Verify local runner and installed tools
        shell: bash
        run: |
          case "$RUNNER_NAME" in
            pve-playwright-01|portatil-playwright-01|portatil-playwright-02) ;;
            *) echo "Unexpected runner: $RUNNER_NAME" >&2; exit 1 ;;
          esac
          node --version
          test "$(pnpm --version)" = 11.25.0
      - name: Install locked dependencies using the local store
        run: pnpm install --frozen-lockfile --store-dir /pnpm/store
      # Cheapest checks first so a formatting slip fails in seconds.
      - name: Prettier (comprobar formato)
        run: pnpm format:check
      - name: TypeScript typecheck
        run: pnpm exec tsc --noEmit -p tsconfig.app.json
      # Execute the same unit-test files as pnpm test, one at a time, so a stuck
      # worker is attributable to a single file and cannot occupy the runner indefinitely.
      - name: Unit tests (per-file timeout and diagnostics)
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/*.test.ts; do
            echo "::group::Unit tests: $file"
            if timeout --signal=TERM --kill-after=10s 120s \
              node --experimental-transform-types --test --test-timeout=90000 "$file"; then
              echo "::endgroup::"
            else
              status=$?
              echo "::endgroup::"
              echo "::error file=$file::Unit tests failed or timed out (exit $status)"
              exit "$status"
            fi
          done
      # The build needs no secrets or Site variables.
      - run: pnpm build
      # Informative until the existing errors are fixed; see docs/PRUEBAS.md.
      - name: Lint (sin regresiones)
        run: pnpm lint:ratchet

  browser:
    name: Playwright desktop and mobile
    # Only after the fast checks pass: a red check never occupies a Playwright runner.
    needs: checks
    # Use the same pool so Playwright can run while the laptop is offline.
    # One Playwright process and one worker keep RAM and isolated D1 within tested limits.
    # PRs run the @smoke subset; main and manual runs run everything.
    runs-on: [self-hosted, Linux, X64, "${{ inputs.runner || 'vacaciones-ci-v2' }}"]
    timeout-minutes: 30
    env:
      CI: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_JSON_OUTPUT_FILE: /job-control/playwright.json
      E2E_SCOPE: ${{ github.event_name == 'pull_request' && 'smoke' || 'full' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          clean: true
      - name: Verify local runner and installed tools
        shell: bash
        run: |
          case "$RUNNER_NAME" in
            pve-playwright-01|portatil-playwright-01|portatil-playwright-02) ;;
            *) echo "Unexpected runner: $RUNNER_NAME" >&2; exit 1 ;;
          esac
          node --version
          test "$(pnpm --version)" = 11.25.0
          test -d /ms-playwright
      - name: Install locked dependencies using the local store
        run: pnpm install --frozen-lockfile --store-dir /pnpm/store
      - name: Playwright ${{ env.E2E_SCOPE }} suite, one worker
        shell: bash
        run: |
          grep=()
          if [ "$E2E_SCOPE" = smoke ]; then grep=(--grep @smoke); fi
          pnpm exec playwright test --workers=1 --retries=0 --reporter=list,json "${grep[@]}"

# No default upload of screenshots, videos or traces: artifacts stay local.
# All jobs use the self-hosted runners; there is no GitHub-hosted fallback.
