version: 2

updates:
  # JavaScript dependencies (pnpm lockfile)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Madrid"

    open-pull-requests-limit: 2

    cooldown:
      default-days: 7

    # Routine updates: only minor and patch.
    # Security updates can still include major upgrades.
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"

    groups:
      runtime:
        applies-to: "version-updates"
        dependency-type: "production"
        patterns: ["*"]

      tooling:
        applies-to: "version-updates"
        dependency-type: "development"
        patterns: ["*"]

      security-runtime:
        applies-to: "security-updates"
        dependency-type: "production"
        patterns: ["*"]

      security-tooling:
        applies-to: "security-updates"
        dependency-type: "development"
        patterns: ["*"]

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Europe/Madrid"

    open-pull-requests-limit: 1

    cooldown:
      default-days: 7

    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"

    groups:
      actions:
        patterns: ["*"]
